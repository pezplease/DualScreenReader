; PlatformIO Project Configuration File

[common_env_data]
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
  Wire
  https://github.com/leethomason/tinyxml2.git
  bitbank2/PNGdec @ ^1.0.1
build_flags =
  -D BOARD_HAS_PSRAM
  -D CONFIG_EPD_DISPLAY_TYPE_ED047TC1
  -D CONFIG_EPD_BOARD_REVISION_LILYGO_T5_47
  ; Stop miniz conflicting with zlib inside the lilygo library
  -D MINIZ_NO_ZLIB_COMPATIBLE_NAMES
  ; Stop PNGdec pulling in Arduino.h when building plain C/C++
  -D __MCUXPRESSO
  ; Enable logging (CORE_DEBUG_LEVEL 4 = INFO, enables ESP_LOGI output)
  -D LOG_ENABLED
  -D CORE_DEBUG_LEVEL=4
  ; Board type
  -D BOARD_TYPE_LILYGO_T5_47_PLUS
  ; SD card SPI pins for T5-4.7-Plus (ESP32-S3)
  -D SD_CARD_PIN_NUM_MISO=GPIO_NUM_16
  -D SD_CARD_PIN_NUM_MOSI=GPIO_NUM_15
  -D SD_CARD_PIN_NUM_CLK=GPIO_NUM_11
  -D SD_CARD_PIN_NUM_CS=GPIO_NUM_42
  ; Battery ADC disabled — ESP32-S3 ADC mapping differs from ESP32.
  ; Uncomment and set the correct channel once verified on hardware.
  ; -D BATTERY_ADC_CHANNEL=ADC2_CHANNEL_3

[env:t5-4-7-plus]
platform = espressif32
framework = ${common_env_data.framework}
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
lib_deps = ${common_env_data.lib_deps}
build_flags = ${common_env_data.build_flags}
board = esp32s3box
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
